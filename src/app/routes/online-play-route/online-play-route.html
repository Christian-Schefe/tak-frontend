@let curGame = currentGame();
@let ongoingGame = game();
@let gamePlayers = players();
@if (curGame && ongoingGame && gamePlayers) {
  <app-game-component [game]="ongoingGame" (action)="onLocalAction($event)" [mode]="curGame.mode">
    <app-game-actions-panel
      [game]="ongoingGame"
      [drawOffer]="myDrawOffer()"
      [undoRequest]="myUndoRequest()"
      (requestDraw)="onRequestDraw()"
      (requestUndo)="onRequestUndo()"
      (retractRequest)="onRetractRequest($event)"
      (resign)="onResign()"
      (requestRematch)="onRequestRematch()"
      (retractRematchRequest)="onRetractRematchRequest()"
      [rematchRequestAction]="rematchRequestAction()"
    ></app-game-actions-panel>
    <app-game-info-panel
      class="grow"
      [game]="ongoingGame"
      [requests]="requests()"
      (setHistoryPlyIndex)="onSetHistoryPlyIndex($event)"
      (requestDecision)="onRequestDecision($event)"
    ></app-game-info-panel>
    <div class="flex flex-col gap-2 p-2">
      <app-game-player-bar
        [gamePlayer]="gamePlayers.white"
        [game]="ongoingGame"
        [playerColor]="'white'"
      >
      </app-game-player-bar>
      <app-game-player-bar
        [gamePlayer]="gamePlayers.black"
        [game]="ongoingGame"
        [playerColor]="'black'"
      >
      </app-game-player-bar>
    </div>
    <app-game-chat-panel class="grow" [gameChatSource]="undefined"></app-game-chat-panel>
  </app-game-component>
} @else {
  <div class="flex flex-col items-center w-full">
    @if (ongoingGameStatus.resource.isLoading()) {
      <p-progress-spinner></p-progress-spinner>
    } @else {
      <p>No ongoing game.</p>
    }
  </div>
}
