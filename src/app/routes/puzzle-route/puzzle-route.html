@let takGame = game()?.game ?? null;
@if (takGame !== null) {
  <app-game-component
    [game]="takGame"
    [mode]="this.solved() ? { type: 'spectator' } : { type: 'local' }"
    [players]="players()"
    [requests]="[]"
    (action)="onAction($event)"
  ></app-game-component>
} @else {
  <p-progress-spinner></p-progress-spinner>
}
