@let eval = adjustedEvaluation();
<div class="h-full p-4 pr-0">
  <div
    class="flex flex-col h-full w-14 rounded-lg overflow-hidden border border-surface-200 dark:border-surface-700"
  >
    <div class="bg-surface-0 transition-all" [style]="{ height: `${eval}%` }"></div>
    <div class="bg-surface-900 transition-all" [style]="{ height: `${100 - eval}%` }"></div>
  </div>
</div>
<app-game-component
  [game]="game()"
  (action)="onAction($event)"
  [mode]="{ type: 'local' }"
  [players]="players()"
  [requests]="[]"
></app-game-component>
