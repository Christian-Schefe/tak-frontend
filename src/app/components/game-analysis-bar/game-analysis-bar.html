@let eval = adjustedEvaluation();
@let evalText = displayEvaluation();
<div
  class="flex flex-col h-full w-10 rounded-lg overflow-hidden border border-surface-200 dark:border-surface-700"
>
  <div
    class="bg-surface-0 justify-start evalbar flex flex-col items-center"
    [style]="{ height: `${eval}%` }"
  >
    <span
      [class]="
        `evallabel py-1 font-mono text-surface-800 text-sm ${eval >= 50 ? 'opacity-100' : 'opacity-0'}`
      "
      >{{ evalText | number: '1.1-1' }}</span
    >
  </div>
  <div
    class="bg-surface-900 justify-end evalbar flex flex-col items-center"
    [style]="{ height: `${100 - eval}%` }"
  >
    <span
      [class]="
        `evallabel py-1 font-mono text-surface-100 text-sm ${eval < 50 ? 'opacity-100' : 'opacity-0'}`
      "
      >{{ evalText | number: '1.1-1' }}</span
    >
  </div>
</div>
