<p-scrollpanel [style]="{ width: '100%', height: '150px', flexGrow: '1' }">
  @for (item of messages(); track $index) {
    <div class="p-1 w-full">
      @if (item.showTimestamp) {
        @let dateFormat = item.showDate ? 'short' : 'shortTime';
        <p class="text-sm text-surface-500 dark:text-surface-300 mb-1 mt-2">
          {{ item.msg.timestamp | date: dateFormat }}
        </p>
      }
      @let playerInfo = playerInfos()[item.msg.sender];
      <div class="w-full text-surface-700 dark:text-surface-400 markdown-body">
        <span class="font-bold wrap-anywhere"
          >{{ playerInfo.hasValue() ? playerInfo.value().displayName : '' }}
        </span>
        <markdown [data]="item.msg.message"></markdown>
      </div>
    </div>
  }
</p-scrollpanel>
