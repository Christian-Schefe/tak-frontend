@let player = playerInfo();
<a [routerLink]="['/player/', player?.id]" class="whitespace-nowrap">
  {{ player?.displayName }}
  @if (player && player.participationRating !== null) {
    <span class="text-muted-color text-sm"
      >{{ ' ' }}({{ player.participationRating | round }})</span
    >
  }
</a>
